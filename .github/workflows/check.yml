# `make check', on every push, on a machine nobody owns.
#
# THE README SAID "TEN CI GATES RUN ON EVERY BUILD" AND THERE WAS NO CI.  There
# was no .github/, no .builds/, and no hosted anything: the gates ran when a
# human typed `make', which is a different claim and a weaker one.  The only
# automated path was the flake's build phase, and it omitted the integration
# test entirely — so the one check that receives state rather than constructing
# it was the one check nothing ran unattended.
#
# Five jobs now, and each answers a question the others cannot.
#
#   check  — the whole of `make check': build, twenty-two gates, the unit suite, and
#            the integration suite against a headless river, with
#            REQUIRE_INTEGRATION=1 so a missing compositor or terminal is a
#            failure rather than a paragraph and an exit 0.  Run under
#            nix-shell, which is where the pinned river lives — and that
#            sentence was aspirational until shell.nix started reading
#            flake.lock.  It took `<nixpkgs>', the ambient channel, so this
#            job tested against whatever river the runner's channel held on
#            the day it ran.  It now tests against the one the protocol was
#            vendored from, which is the only version the program accepts.
#
#   plain  — the same build with *no nix at all*, from bootstrap.sh, because
#            PLAN.org §packaging says "nothing in src/ may know that nix exists;
#            if the flake is deleted the project still builds — that is the
#            test", and a test nobody runs is a sentence.
#
#            IT USED TO STOP AT `make build gates test', AND THAT WAS THE HOLE.
#            The only job that ran an installer ran under nix, while the
#            `check' job carries a comment saying the install "is the one thing
#            here that asks what a *user* gets" — and asks it under nix-shell.
#            So the path every non-nix Linux user takes was never run end to
#            end by anything: not the image, not install.sh, not install-check.
#            It goes all the way now, and it builds against whatever the
#            distribution packages rather than what nixpkgs pins.
#
#   floor   — the declared minimum SBCL, downloaded and run.  `plain' used to
#            carry this job's description as well as its own: it was called
#            "this project's only empirical answer to whether the declared SBCL
#            floor is real", on the grounds that ubuntu-latest ships 2.2.9 and
#            2.2.9 is above the floor.  Above the floor is not the floor.  The
#            answer it gave, on thirty consecutive runs, was *no* — four tests
#            in BOUNDARIES died on an UNBOUND-VARIABLE before reaching an
#            assertion — and nobody read it.
#
#            The cause was a test helper, not the program: a macro whose body
#            referred to a variable bound only after the body ran, which SBCL
#            2.6 deletes and 2.2.9 does not.  Fixed, and the floor turns out to
#            be true.  But "turns out to be true" is a sentence, and a sentence
#            about a version nothing runs is the exact shape of claim this whole
#            file exists to convert into a fact.  So the floor is now run: the
#            number comes out of latticewm.asd with sed, the way bootstrap.sh
#            already reads it, so there is no copy of it here to go stale.
#
#   flake  — `nix build' and `nix flake check', which ran never.  `nix build'
#            is the only thing that has ever caught a river protocol break: it
#            is the phase that connects to the pinned compositor, and it failed
#            when river bumped river_window_manager_v1 from 4 to 5 in a *patch*
#            release.  Leaving it to `nix build' on somebody's laptop is how
#            that gets found at a login screen instead.
#
#   surface — `make surface && git diff --exit-code doc/'.  Two lines, and
#            they convert the largest unbacked claim in the corpus into a fact.
#            README.org says of the six generated documents: "All three are
#            generated from the running image, so none of them can drift."
#            That is a claim about the *generator*, not about the repository —
#            `make surface' is not in `all:', not in `check:', and was in no CI
#            job, so nothing regenerated and diffed, and 232 KB of committed
#            .txt was a snapshot of whichever machine last ran the command.
#            The Makefile's own comment says "a generated document cannot go
#            stale, which is its whole argument", in the same block that
#            records the target once truncating all six files to empty and
#            exiting 0 — conceding that stale is possible without noticing.
#
#            This was not merely unenforced, it was unenforceable: OPTIONS.txt
#            line 1 held the author's home directory, EXTENSION-SURFACE.txt
#            held his build tree on four lines, and the `read by:' lists came
#            out of an unordered cross-reference table, so two machines
#            produced two files.  All three are fixed; this is the check that
#            keeps them fixed.

name: check

# One run per ref.  Two pushes in a minute used to mean two full cold builds
# racing each other, and the older one's result is worthless the moment the
# newer one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: build, gates, tests, headless river
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      # ASDF's fasl cache, keyed on the sources that produce it.  A cold build
      # recompiles every dependency on every push; this is the difference
      # between a check somebody waits for and one they stop reading.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/common-lisp
          key: fasl-nix-${{ hashFiles('**/*.lisp', '**/*.asd', 'flake.lock') }}
          restore-keys: fasl-nix-
      # XDG_RUNTIME_DIR is where the Wayland socket and the shm files go, and a
      # GitHub runner has none — river would take /tmp and the test would take
      # river's word for it, which is exactly the assumption start-river exists
      # to avoid making.
      - name: make check
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          nix-shell --run 'make check'
      # The image, then the installer against a scratch prefix.  This is the
      # only step that answers "does a packaged install contain what the
      # documents promise?", and the answer was no for the whole life of the
      # gate that is named after asking it.
      - name: make install-check
        run: nix-shell --run 'make install-check'

  plain:
    name: no nix, from bootstrap.sh, all the way to an install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # DELIBERATELY THE DISTRIBUTION'S SBCL, not a pinned one.  This job is
      # the only place the declared floor in latticewm.asd meets an SBCL that
      # somebody else chose, and "whether this builds on the older one" was an
      # empirical question nobody had asked.
      - name: install sbcl
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - name: sbcl version
        run: sbcl --version
      # .deps/ is the whole of what bootstrap.sh fetches, and the dist inside
      # it is pinned, so the key can be the pin.
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-plain-${{ hashFiles('bootstrap.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/common-lisp
          key: fasl-plain-${{ hashFiles('**/*.lisp', '**/*.asd') }}
          restore-keys: fasl-plain-
      - name: bootstrap and build
        run: |
          ./bootstrap.sh
          make build gates test
      # THE RECIPE MOST USERS WILL HAVE TO FOLLOW.  The pin is exact and the
      # program refuses rather than misbehaves, so on most distributions at
      # most times the packaged river will not match and INSTALL.org's
      # four-step re-vendor is the install path -- and until this step nothing
      # had ever asked whether it still worked.  This half needs no river: it
      # pretends the vendored XML declares a version the program does not bind
      # and asserts the build refuses by name.  It restores the tree after
      # itself, so the steps below still see the real protocol.
      - name: the re-vendor recipe refuses a river we cannot speak to
        run: make revendor-check
      # THE HALF THAT WAS MISSING.  Everything above this line was already
      # here; everything below it is the path a non-nix user actually takes.
      - name: image, install, install-check
        run: make install-check
      - name: install to a scratch prefix, and take it back out
        run: |
          prefix="$RUNNER_TEMP/prefix"
          make install PREFIX="$prefix"
          test -x "$prefix/bin/latticewm"
          "$prefix/bin/latticewm" --version
          "$prefix/bin/latticewm" --list-options | head -3
          make uninstall PREFIX="$prefix"
      # And the packaging path, which is what a distribution runs and what no
      # check in this project could express until DESTDIR existed.
      - name: a staged packaging install
        run: |
          make install DESTDIR="$RUNNER_TEMP/pkg" PREFIX=/usr
          test -x "$RUNNER_TEMP/pkg/usr/bin/latticewm"
          grep -q '^exec river -c "/usr/bin/latticewm' \
               "$RUNNER_TEMP/pkg/usr/bin/latticewm-session"
      - name: make dist
        run: make dist

  floor:
    name: the declared minimum SBCL, actually run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE NUMBER IS NOT WRITTEN HERE.  It is read out of latticewm.asd with
      # the same sed bootstrap.sh uses, so raising or lowering the floor is one
      # edit in one file and this job follows it.  A copy of the version in a
      # workflow is a copy that comes to disagree with the check the program
      # performs, which is the defect gate 19 exists for one currency over.
      - name: fetch and install the floor SBCL
        run: |
          set -eu
          floor=$(sed -n 's/^(defparameter cl-user::\*latticewm-minimum-sbcl\* "\([0-9.]*\)".*/\1/p' \
                      latticewm.asd)
          test -n "$floor" || { echo "could not read the floor out of latticewm.asd"; exit 1; }
          echo "the declared floor is SBCL $floor"
          f="sbcl-$floor-x86-64-linux-binary.tar.bz2"
          curl -fsSL -o "$f" \
            "https://downloads.sourceforge.net/project/sbcl/sbcl/$floor/$f"
          tar xf "$f"
          ( cd "sbcl-$floor-x86-64-linux" && INSTALL_ROOT="$HOME/sbcl-floor" sh install.sh )
          # On PATH, not just in a variable.  bootstrap.sh resolves `sbcl'
          # itself -- it has to, because the version check it performs is about
          # whichever compiler a user actually has -- so a floor SBCL that only
          # exists in $LISP would be bootstrapped by a compiler that is not the
          # one under test, or by none at all.
          echo "SBCL_HOME=$HOME/sbcl-floor/lib/sbcl" >> "$GITHUB_ENV"
          echo "$HOME/sbcl-floor/bin" >> "$GITHUB_PATH"
      - name: sbcl version
        run: |
          command -v sbcl
          sbcl --version
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-floor-${{ hashFiles('bootstrap.sh') }}
      # No fasl cache here on purpose.  This job's whole question is whether a
      # cold compile succeeds on the oldest compiler, and a warm cache is the
      # state in which gate 1 once missed real warnings in files that did not
      # happen to recompile.
      - name: bootstrap, build, gates, tests
        run: |
          ./bootstrap.sh
          make build gates test
      # AND THE CONSTRAINT THE FLOOR IS SET BY, WHICH TURNS OUT NOT TO BE
      # TESTABLE HERE -- AND THAT IS ITSELF WORTH ASSERTING.
      #
      # 2.2.6 is the number because core compression became zstd there and
      # tools/image.lisp dumps at level 22.  But compression is a *build-time
      # option* of SBCL rather than a property of its version, and the official
      # binary tarball for 2.2.6 was built without it.  So this runner can
      # prove the program builds and passes on the declared floor, and it
      # cannot make the image there -- not because the floor is wrong, but
      # because the compiler this job can install is not the compiler a
      # distribution ships.
      #
      # Rather than skip it, assert the behaviour that discovering this
      # produced: the dump refuses in a sentence naming the cause and the way
      # out, instead of an unhandled SIMPLE-ERROR under eighteen frames of SBCL
      # backtrace at the end of an otherwise green build.  That message is a
      # shipped diagnostic like any other, and it sits on the path a person
      # hits doing exactly what this job does.
      - name: the image, or the reason there cannot be one
        run: |
          set -eu
          if sbcl --noinform --non-interactive \
               --eval '(sb-ext:exit :code (if (find :sb-core-compression *features*) 0 1))'
          then
            echo "this SBCL can compress a core, so the image itself is the check"
            make install-check
          else
            echo "this SBCL cannot compress a core, so the diagnostic is the check"
            out=$(make image 2>&1 || true)
            printf '%s\n' "$out"
            printf '%s' "$out" | grep -q "this SBCL cannot compress a core" || {
              echo "::error::make image did not print the compression diagnostic"
              exit 1; }
            printf '%s' "$out" | grep -q "LATTICEWM_COMPRESS=0" || {
              echo "::error::the diagnostic did not name the way out"
              exit 1; }
            test ! -e ./latticewm || {
              echo "::error::make image refused and left an image behind"
              exit 1; }
            echo "and the uncompressed path still works on this compiler:"
            LATTICEWM_COMPRESS=0 make image
            test -x ./latticewm
          fi

  flake:
    name: nix build, nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # `nix build' runs the flake's buildPhase, which connects to the pinned
      # river.  It is the only thing that has ever caught a protocol break.
      - name: nix build
        run: nix build --print-build-logs
      - name: nix flake check
        run: nix flake check --print-build-logs

  surface:
    name: the generated documents are the ones in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install sbcl
        run: sudo apt-get update && sudo apt-get install -y sbcl
      - uses: actions/cache@v4
        with:
          path: .deps
          key: deps-plain-${{ hashFiles('bootstrap.sh') }}
      - name: bootstrap
        run: ./bootstrap.sh
      # The two lines.  `git diff --exit-code' prints what drifted, which is
      # the whole diagnostic: the failure is always "somebody changed the
      # program and did not run `make surface'", and the diff says which
      # document and which line.
      - name: make surface
        run: make surface
      - name: nothing under doc/ changed
        run: git diff --exit-code -- doc/
